<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Floorplanner Pro</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="app">

    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo"></div>
            <div>
                <strong>Floorplanner Pro</strong>
                <span>Architecture Studio</span>
            </div>
        </div>

        <div class="menu-list">

            <div class="menu-section-title">Build</div>

            <button class="menu-item active" data-tool="room">
                <i class="icon-shape icon-room"></i>
                <span>Draw Room</span>
            </button>

            <button class="menu-item" data-tool="wall">
                <i class="icon-shape icon-wall"></i>
                <span>Draw Wall</span>
            </button>

            <button class="menu-item" data-tool="door">
                <i class="icon-shape icon-door"></i>
                <span>Place Doors</span>
            </button>

            <button class="menu-item" data-tool="window">
                <i class="icon-shape icon-window"></i>
                <span>Place Windows</span>
            </button>

            <div class="menu-section-title">Objects</div>

            <button class="menu-item" data-tool="bed">
                <i class="icon-shape icon-bed"></i>
                <span>Bed</span>
            </button>

            <button class="menu-item" data-tool="sofa">
                <i class="icon-shape icon-sofa"></i>
                <span>Sofa</span>
            </button>

            <button class="menu-item" data-tool="table">
                <i class="icon-shape icon-table"></i>
                <span>Table</span>
            </button>

            <div class="menu-section-title">Tools</div>

            <button class="menu-item" data-tool="select">
                <i class="icon-shape icon-select"></i>
                <span>Select & Move</span>
            </button>

            <div class="menu-action-area">
                <button class="action-btn save-btn" id="exportBtn">
                    Export JSON
                </button>

                <label class="action-btn import-btn">
                    Import JSON
                    <input type="file" id="importInput" accept=".json,application/json">
                </label>

                <button class="action-btn clear-btn" id="clearBtn">
                    Reset All
                </button>
            </div>

        </div>
    </aside>

    <main id="main-container">

        <header class="top-bar">

            <div class="project-info">
                <span class="project-label">Project:</span>
                <span class="project-name">Example House</span>
                <span id="stats-badge" class="stats-badge">
                    Area: 0.0 m²
                </span>
            </div>

            <div class="top-actions">

                <button class="undo-btn" id="undoBtn" title="Undo">
                    ↶
                </button>

                <button class="undo-btn" id="redoBtn" title="Redo">
                    ↷
                </button>

                <div class="view-switch">
                    <button class="view-btn active" id="btn2d">
                        2D
                    </button>

                    <button class="view-btn" id="btn3d">
                        3D
                    </button>
                </div>

            </div>

        </header>

        <section id="viewport">

            <div class="toolbar-float">

                <button
                    class="float-btn active-snap"
                    id="snap-btn"
                    title="Snap to Grid">
                    <span>Grid</span>
                </button>

                <button
                    class="float-btn"
                    id="zoomInBtn"
                    title="Zoom In">
                    +
                </button>

                <button
                    class="float-btn"
                    id="zoomOutBtn"
                    title="Zoom Out">
                    −
                </button>

                <button
                    class="float-btn"
                    id="fitBtn"
                    title="Fit">
                    Fit
                </button>

                <button
                    class="float-btn danger"
                    id="deleteBtn"
                    title="Delete Selected">
                    Del
                </button>

            </div>

            <div id="mobile-hint">
                1本指: 操作　・　2本指: 移動 / 拡大縮小
            </div>

            <canvas id="c2d"></canvas>

            <div id="canvas3d"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
