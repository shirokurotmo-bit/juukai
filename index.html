<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>福祉用具・住宅改修 図面作成システム</title>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        /* 印刷時の最適化 */
        @media print {
            body { background: white !important; color: black !important; }
            no-print { display: none !important; }
            .print-area { background: white !important; border: 2px solid black !important; box-shadow: none !important; color: black !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center no-print">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">FastCAD</span>
            <h1 class="text-lg font-semibold tracking-wide">住宅改修・申請図面エディタ</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-blue-500/20">
                図面を印刷 / PDF出力
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col lg:flex-row p-6 gap-6 max-w-[1600px] w-full mx-auto">
        
        <!-- 左側：コントロールパネル（最新鋭ミニマル） -->
        <div class="w-full lg:w-80 bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-5 flex flex-col gap-6 no-print">
            
            <!-- 顧客情報入力 -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">お客様氏名</label>
                <input type="text" id="clientName" value="小田 義重" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-blue-500 transition" placeholder="例: 山田 太郎">
                <span class="text-xs text-slate-500 mt-1 block">様邸 図面</span>
            </div>

            <!-- 部屋ブロック追加 -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">部屋ブロック追加</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addRoom('玄関')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 玄関</button>
                    <button onclick="addRoom('WC')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ WC</button>
                    <button onclick="addRoom('脱衣場')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 脱衣場</button>
                    <button onclick="addRoom('風呂')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 風呂</button>
                    <button onclick="addRoom('廊下')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 廊下</button>
                    <button onclick="addRoom('居間')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 居間</button>
                    <button onclick="addRoom('和室/寝室')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 和室/寝室</button>
                    <button onclick="addRoom('台所')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-700/55 transition text-left">＋ 台所</button>
                </div>
            </div>

            <!-- 注釈マーカー追加 -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">手すり・改修ポイント番号</label>
                <div class="flex gap-2">
                    <input type="text" id="markerLabel" value="①" class="w-16 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-sm text-center">
                    <button onclick="addMarker()" class="flex-1 bg-amber-600/20 border border-amber-500/30 hover:bg-amber-600/30 text-amber-300 text-xs py-2 rounded-xl transition font-medium">マーカー配置</button>
                </div>
            </div>

            <div class="mt-auto bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80 text-xs text-slate-400 leading-relaxed">
                💡 <span class="text-slate-300 font-medium">使い方：</span>配置された部屋はドラッグで位置を微調整できます。不要な要素はダブルクリックで削除可能です。
            </div>
        </div>

        <!-- 右側：図面キャンバスエリア -->
        <div class="flex-1 bg-slate-900/60 border border-slate-800 rounded-2xl p-8 flex flex-col justify-center items-center relative overflow-hidden">
            
            <!-- 実際の図面フレーム -->
            <div id="drawingCanvas" class="print-area bg-white text-slate-900 w-full max-w-4xl aspect-[4/3] rounded-lg shadow-2xl p-8 relative flex flex-col justify-between border-2 border-slate-900 grid-bg">
                
                <!-- タイトル行 -->
                <div class="flex justify-between items-center border-b-2 border-slate-900 pb-3">
                    <h2 id="titleDisplay" class="text-xl font-bold tracking-tight">小田 義重様邸 図面</h2>
                    <span class="text-xs font-semibold tracking-widest text-slate-600 uppercase">FUKUSHI REFORM PLAN</span>
                </div>

                <!-- 部屋配置グリッド領域 -->
                <div id="roomContainer" class="flex-1 relative my-4 border border-slate-300 bg-slate-50/50 rounded">
                    <!-- 初期サンプル配置（JavaScriptで制御） -->
                </div>

                <!-- 図面フッター -->
                <div class="flex justify-between items-end text-xs text-slate-500 border-t border-slate-300 pt-3">
                    <div>福祉用具・住宅改修 申請提出用図面</div>
                    <div>縮尺：非宿尺（レイアウト確認用）</div>
                </div>

            </div>

        </div>

    </main>

    <!-- インタラクション制御用JavaScript -->
    <script>
        const roomContainer = document.getElementById('roomContainer');
        const clientNameInput = document.getElementById('clientName');
        const titleDisplay = document.getElementById('titleDisplay');

        // リアルタイムタイトル更新
        clientNameInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            titleDisplay.textContent = val ? `${val}様邸 図面` : '（お名前未入力）様邸 図面';
        });

        // 初期サンプルルームデータの配置
        const initialRooms = [
            { name: '玄関', x: 20, y: 20, w: 120, h: 80 },
            { name: 'WC', x: 145, y: 20, w: 100, h: 80 },
            { name: '脱衣場', x: 250, y: 20, w: 100, h: 80 },
            { name: '風呂', x: 355, y: 20, w: 100, h: 80 },
            { name: '廊下', x: 20, y: 105, w: 435, h: 60 },
            { name: '和室/寝室', x: 20, y: 170, w: 210, h: 120 },
            { name: '居間', x: 235, y: 170, w: 220, h: 120 },
            { name: '台所', x: 460, y: 20, w: 120, h: 270 }
        ];

        function renderInitialRooms() {
            roomContainer.innerHTML = '';
            initialRooms.forEach(r => createRoomElement(r.name, r.x, r.y, r.w, r.h));
        }

        function addRoom(name) {
            createRoomElement(name, 50, 50, 100, 80);
        }

        function createRoomElement(name, x, y, w, h) {
            const div = document.createElement('div');
            div.className = 'absolute bg-white border-2 border-slate-900 flex items-center justify-center text-xs font-bold text-slate-800 cursor-move select-none shadow-sm hover:border-blue-600 transition-colors';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.width = w + 'px';
            div.style.height = h + 'px';
            div.textContent = name;

            // ダブルクリックで削除
            div.addEventListener('dblclick', () => div.remove());

            // ドラッグ移動ロジック
            let isDragging = false;
            let startX, startY;

            div.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - div.offsetLeft;
                startY = e.clientY - div.offsetTop;
                div.style.zIndex = 100;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let nx = e.clientX - startX;
                let ny = e.clientY - startY;
                div.style.left = Math.max(0, nx) + 'px';
                div.style.top = Math.max(0, ny) + 'px';
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                div.style.zIndex = 1;
            });

            roomContainer.appendChild(div);
        }

        function addMarker() {
            const labelText = document.getElementById('markerLabel').value || '①';
            const marker = document.createElement('div');
            marker.className = 'absolute bg-amber-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold cursor-move shadow-md border border-white';
            marker.style.left = '100px';
            marker.style.top = '100px';
            marker.textContent = labelText;

            marker.addEventListener('dblclick', () => marker.remove());

            let isDragging = false;
            let startX, startY;

            marker.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - marker.offsetLeft;
                startY = e.clientY - marker.offsetTop;
                marker.style.zIndex = 200;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                marker.style.left = (e.clientX - startX) + 'px';
                marker.style.top = (e.clientY - startY) + 'px';
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                marker.style.zIndex = 10;
            });

            roomContainer.appendChild(marker);
        }

        // 初期化実行
        window.onload = renderInitialRooms;
    </script>
</body>
</html>
